name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/be-todo:latest ./backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/be-todo:latest

      - name: Trigger Render backend deploy
        run: curl -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} \
            -t ${{ secrets.DOCKER_USERNAME }}/fe-todo:latest \
            ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/fe-todo:latest

      - name: Trigger Render frontend deploy
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"